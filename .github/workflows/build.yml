name: CMake builds
on: [push, pull_request]
jobs:
  headless:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset headless
      - run: cmake --build --preset headless --parallel 2
      - run: ctest --preset headless
  qt-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qtbase5-dev libqt5svg5-dev
      - run: cmake --preset desktop
      - run: cmake --build --preset desktop --parallel 2
      - run: ctest --preset desktop
